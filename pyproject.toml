[project]
name = "jordan-currency-detector"
version = "0.1.0"
description = "Detect, count and value Jordanian coins and banknotes in images and video."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Albara Shehadeh" }]
keywords = ["computer-vision", "object-detection", "yolo", "tracking", "currency", "jordan"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
jcd = "jcd.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcd"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "PTH", "RET"]
# The original dataset's class names really use U+2044 FRACTION SLASH ("1⁄2-dinar").
allowed-confusables = ["⁄", "∕"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jcd"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["jcd"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
